name: build

on:
  push:
  workflow_dispatch:
    inputs:
      release:
        description: Publish the verified packages as a GitHub Release
        type: boolean
        default: false

env:
  UPSTREAM_REPOSITORY: WorldObservationLog/wrapper
  UPSTREAM_COMMIT: 2fd7e0eaef081f93cf687428b965674937832ba4
  DOBBY_REVISION: 9d271803881f467aabfc24593c7dcaeb710fe861

jobs:
  docker:
    name: Build Docker image
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM_REPOSITORY }}
          ref: ${{ env.UPSTREAM_COMMIT }}
          path: upstream

      - name: Prepare build context
        run: |
          sed -i "s/GIT_TAG        master/GIT_TAG        ${DOBBY_REVISION}/" upstream/CMakeLists.txt
          grep -q "GIT_TAG        ${DOBBY_REVISION}" upstream/CMakeLists.txt
          cp docker/Dockerfile upstream/apmyx.Dockerfile
          cp docker/login.sh upstream/apmyx-login.sh
          printf '.git\n.github\nrootfs/data\ndata\n*.apk\n*.apkm\n*.zip\n' > upstream/apmyx.Dockerfile.dockerignore

      - name: Build image
        run: |
          image="apmyx/wrapper-lite:${UPSTREAM_COMMIT:0:7}-${{ github.run_number }}"
          echo "IMAGE=$image" >> "$GITHUB_ENV"
          docker build --platform linux/amd64 --file upstream/apmyx.Dockerfile --tag "$image" upstream

      - name: Image has no account data
        run: |
          test -z "$(docker run --rm --entrypoint /bin/sh "$IMAGE" -c 'ls -A /app/rootfs/data')"

      - name: Wrapper answers without an account
        run: |
          docker volume create check-data
          docker run --detach --name check --platform linux/amd64 --cap-add SYS_ADMIN --cap-add SYS_CHROOT --cap-add SYS_PTRACE \
            --security-opt apparmor=unconfined --mount type=volume,source=check-data,target=/app/rootfs/data \
            --publish 127.0.0.1:12340:12340 "$IMAGE"
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:12340/status > status.json; then break; fi
            sleep 2
          done
          cat status.json
          grep -q '"code":0' status.json
          docker logs check | tail -20
          docker rm --force check
          docker volume rm check-data

      - name: Save image
        run: |
          mkdir dist
          docker save "$IMAGE" | gzip -9 > dist/wrapper-lite-docker-linux-amd64.tar.gz
          docker image inspect --format '{{.Id}}' "$IMAGE" > dist/wrapper-lite-docker-linux-amd64.id
          printf '%s\n' "$IMAGE" > dist/wrapper-lite-docker-linux-amd64.tag
          ls -la dist
          cat dist/*.id dist/*.tag

      - uses: actions/upload-artifact@v4
        with:
          name: wrapper-lite-docker-linux-amd64
          path: dist
          retention-days: 7

  build-assets:
    name: Build wrapper-lite and guest assets
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: upstream
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM_REPOSITORY }}
          ref: ${{ env.UPSTREAM_COMMIT }}
          path: upstream

      - name: Install host build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake unzip git aria2

      - name: Download Android NDK r23b
        run: |
          aria2c -o android-ndk-r23b-linux.zip https://dl.google.com/android/repository/android-ndk-r23b-linux.zip
          unzip -q android-ndk-r23b-linux.zip

      - name: Restore busybox-static package
        run: apt-get download busybox-static

      - name: Configure and build wrapper-lite (Release)
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target wrapper_lite_exe wrapper_lite_rootless_exe -j$(nproc)
          cmake --build build -j$(nproc)

      - name: Build QEMU assets
        run: |
          chmod +x qemu/*.sh
          ./qemu/mkdata.sh
          ./qemu/build.sh

      - name: Package QEMU assets
        run: |
          mkdir -p dist-qemu-assets
          cp qemu/vmlinuz-lite-qemu qemu/lite-initramfs.cpio.gz qemu/data.img README.md LICENSE dist-qemu-assets/

      - uses: actions/upload-artifact@v4
        with:
          name: qemu-assets
          path: upstream/dist-qemu-assets
          retention-days: 7

  package:
    name: Package ${{ matrix.name }}
    needs: build-assets
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-22.04
          - name: linux-aarch64
            os: ubuntu-22.04-arm
          - name: windows-x86_64
            os: windows-2022
          - name: macos-aarch64
            os: macos-14
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: upstream
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM_REPOSITORY }}
          ref: ${{ env.UPSTREAM_COMMIT }}
          path: upstream

      - uses: actions/download-artifact@v4
        with:
          name: qemu-assets
          path: upstream/qemu-assets

      - name: Install QEMU (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 seabios ipxe-qemu

      - name: Install QEMU (macOS)
        if: runner.os == 'macOS'
        run: brew install qemu

      - name: Install QEMU (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install qemu -y --no-progress

      - name: Build launcher
        shell: bash
        run: |
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            g++ -std=c++11 -O2 -static -o wrapper-lite-qemu.exe wrapper-lite-qemu.cpp
          else
            c++ -std=c++11 -O2 -o wrapper-lite-qemu wrapper-lite-qemu.cpp
          fi

      - name: Assemble QEMU package
        shell: bash
        run: |
          mkdir -p dist/qemu/bin
          cp -R qemu-assets/* dist/qemu/
          cp README.md LICENSE dist/
          if [[ "${{ runner.os }}" == "Windows" ]]; then cp wrapper-lite-qemu.exe dist/; else cp wrapper-lite-qemu dist/; fi

      - name: Copy QEMU binary and firmware (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set +e
          cp "$(command -v qemu-system-x86_64)" dist/qemu/bin/ 2>/dev/null || true
          if [[ "${{ runner.os }}" == "macOS" ]]; then
            cp -R "$(brew --prefix)/share/qemu/"* dist/qemu/bin/ 2>/dev/null || true
          else
            cp -R /usr/share/qemu/. dist/qemu/bin/ 2>/dev/null || true
            cp -R /usr/share/seabios/. dist/qemu/bin/ 2>/dev/null || true
            cp -R /usr/lib/ipxe/qemu/. dist/qemu/bin/ 2>/dev/null || true
            mkdir -p dist/qemu/lib
            ldd "$(command -v qemu-system-x86_64)" 2>/dev/null | awk '/=> \// {print $3}' | sort -u | \
              while read -r so; do
                [ -f "$so" ] || continue
                case "${so##*/}" in
                  libc.so.6|libm.so.6|ld-linux*|libdl.so*|libpthread.so*|librt.so*|libresolv.so*|libnss_*|libutil.so*|libanl.so*|libBrokenLocale.so*|libthread_db.so*) ;;
                  *) cp -n "$so" dist/qemu/lib/ 2>/dev/null || true ;;
                esac
              done
            if ls dist/qemu/bin/libc.so.6 dist/qemu/bin/libm.so.6 >/dev/null 2>&1; then
              echo "::error::glibc was copied into dist/qemu/bin"; exit 1
            fi
            MODDIR="$(find /usr/lib /usr/lib64 -type f -name 'accel-*.so' 2>/dev/null | xargs -r dirname | sort -u | head -1)"
            if [ -n "$MODDIR" ] && [ -d "$MODDIR" ]; then cp -R "$MODDIR/." dist/qemu/bin/ 2>/dev/null || true; fi
          fi

      - name: Copy QEMU binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $qemuDir = $null
          $q = Get-Command qemu-system-x86_64.exe -ErrorAction SilentlyContinue
          if ($q) { $qemuDir = Split-Path $q.Source }
          if (-not $qemuDir) {
            $qemuDir = @('C:/Program Files/qemu', 'C:/ProgramData/chocolatey/bin') | Where-Object { Test-Path (Join-Path $_ 'qemu-system-x86_64.exe') } | Select-Object -First 1
          }
          if (-not $qemuDir) { Write-Error 'qemu-system-x86_64.exe not found'; exit 1 }
          $dst = 'dist/qemu/bin'
          New-Item -ItemType Directory -Force -Path $dst | Out-Null
          Copy-Item (Join-Path $qemuDir 'qemu-system-x86_64.exe') $dst
          Get-ChildItem (Join-Path $qemuDir '*.dll') -File | ForEach-Object { Copy-Item $_.FullName $dst }
          $share = Join-Path $qemuDir 'share'
          if (Test-Path $share) { Copy-Item -Recurse -Force (Join-Path $share '*') $dst } else {
            $bios = Get-ChildItem -Path $qemuDir -Recurse -Filter 'bios-256k.bin' -File -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($bios) { Copy-Item -Recurse -Force (Join-Path $bios.DirectoryName '*') $dst }
          }

      - name: Zip package (keeps executable bits)
        shell: bash
        run: |
          name="wrapper-lite-qemu-${{ matrix.name }}.zip"
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            (cd dist && 7z a -tzip -mx=9 "../$name" . >/dev/null)
          else
            (cd dist && zip -qr -9 "../$name" .)
          fi
          ls -la "$name"

      - uses: actions/upload-artifact@v4
        with:
          name: wrapper-lite-qemu-${{ matrix.name }}
          path: upstream/wrapper-lite-qemu-${{ matrix.name }}.zip
          compression-level: 0
          retention-days: 7

  verify:
    name: Boot ${{ matrix.name }}
    needs: package
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
          - name: linux-aarch64
            os: ubuntu-24.04-arm
          - name: windows-x86_64
            os: windows-latest
          - name: macos-aarch64
            os: macos-15
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: wrapper-lite-qemu-${{ matrix.name }}

      - name: Allow KVM (Linux)
        if: runner.os == 'Linux'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true

      - name: Homebrew QEMU libraries (macOS)
        if: runner.os == 'macOS'
        run: brew install qemu

      - name: Boot with the bundled launcher (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          unzip -q wrapper-lite-qemu-${{ matrix.name }}.zip -d pkg
          cd pkg
          ./wrapper-lite-qemu > ../launcher.log 2>&1 &
          for i in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:12340/status > ../status.json 2>/dev/null; then break; fi
            sleep 5
          done
          cat ../status.json
          grep -q '"code":0' ../status.json
          pkill -f qemu-system-x86_64 || true
          pkill -f wrapper-lite-qemu || true

      - name: Boot with the bundled launcher (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          Expand-Archive -Path wrapper-lite-qemu-${{ matrix.name }}.zip -DestinationPath pkg
          $launcher = Start-Process -FilePath (Resolve-Path 'pkg/wrapper-lite-qemu.exe') -ArgumentList '--accel', 'tcg' -WorkingDirectory (Resolve-Path 'pkg') -RedirectStandardOutput launcher.log -RedirectStandardError launcher-error.log -PassThru -WindowStyle Hidden
          $status = $null
          for ($i = 0; $i -lt 120 -and -not $status; $i++) {
            try { $status = Invoke-RestMethod -Uri 'http://127.0.0.1:12340/status' -TimeoutSec 5 } catch { Start-Sleep -Seconds 5 }
          }
          Get-Process qemu-system-x86_64 -ErrorAction SilentlyContinue | Stop-Process -Force
          Stop-Process -Id $launcher.Id -Force -ErrorAction SilentlyContinue
          if (-not $status -or $status.code -ne 0) { Get-Content launcher.log, launcher-error.log -ErrorAction SilentlyContinue; throw 'Wrapper did not answer.' }
          $status | ConvertTo-Json -Compress

      - name: Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: verify-logs-${{ matrix.name }}
          path: "*.log"
          retention-days: 7
          if-no-files-found: warn

  release:
    name: Publish release
    needs: [verify, docker]
    if: github.event_name == 'workflow_dispatch' && inputs.release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wrapper-lite-*
          merge-multiple: true
          path: assets

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd assets
          sha256sum *.zip *.tar.gz > SHA256SUMS
          cat SHA256SUMS
          tag="lite-${UPSTREAM_COMMIT:0:7}-${{ github.run_number }}"
          gh release create "$tag" *.zip *.tar.gz *.id *.tag SHA256SUMS \
            --title "Wrapper Lite ${UPSTREAM_COMMIT:0:7} (build ${{ github.run_number }})" \
            --notes "${UPSTREAM_REPOSITORY}@${UPSTREAM_COMMIT}"
